{{- $announcement := site.Params.announcement | default "" -}}
{{- $isRemote := hasPrefix $announcement "http" -}}
<div class="pst-async-banner-revealer d-none">
  <aside id="bd-header-version-warning" class="d-none d-print-none" aria-label="Version warning"></aside>
  {{- if $isRemote }}
  <aside class="bd-header-announcement d-print-none d-none" aria-label="Announcement" data-pst-announcement-url="{{ $announcement }}"></aside>
  {{- end }}
</div>
{{- if and $announcement (not $isRemote) }}
<aside class="bd-header-announcement" aria-label="Announcement">
  <div class="bd-header-announcement__content">{{ $announcement }}</div>
</aside>
{{- end }}
