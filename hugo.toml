baseURL = 'https://saltproject.io/'
locale  = 'en-us'
title   = 'Salt Project'
theme   = 'pydata'

[outputs]
  home    = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  page    = ['HTML']

[taxonomies]
  tag      = 'tags'
  category = 'categories'

# ---------------------------------------------------------------------------
# Site menus — override the theme's default demo menus entirely.
# ---------------------------------------------------------------------------
[menus]
  [[menus.main]]
    name    = 'Home'
    pageRef = '/'
    weight  = 10
  [[menus.main]]
    name    = 'Blog'
    pageRef = '/blog'
    weight  = 20
  [[menus.main]]
    name    = 'Tags'
    pageRef = '/tags'
    weight  = 30

# ---------------------------------------------------------------------------
# Site-level theme params.
# ---------------------------------------------------------------------------
[params]
  favicon           = 'images/SaltProject_Logomark_teal.png'
  sidebar_nav_title = 'Salt Project'
  copyright         = '© Copyright 2005-{year} Broadcom. All Rights Reserved. The term "Broadcom" refers to Broadcom Inc. and/or its subsidiaries.'
  # All flat params must come BEFORE any [params.*] sub-tables in TOML.
  navbar_center     = ['header-links']
  github_url        = 'https://github.com/saltstack'

  # Salt Project logo — same image for light and dark (matches salt-install-guide).
  # text is explicitly set to '' to suppress the text fallback from the theme default.
  [params.logo]
    text        = ''
    image_light = 'images/SaltProject_altlogo_teal.png'
    image_dark  = 'images/SaltProject_altlogo_teal.png'
    alt_text    = 'Salt Project - Home'

[params.landing]
  title             = "Welcome to the Salt Project"
  description       = "Salt is an open-source automation framework for remote execution, configuration management, and infrastructure orchestration — used by teams to manage thousands of systems from a single control plane."
  show_recent_posts = true

[[params.landing.nav_boxes]]
  title       = "Install Salt"
  description = "Step-by-step instructions for every platform and operating system."
  url         = "https://docs.saltproject.io/salt/install-guide/en/latest/"

[[params.landing.nav_boxes]]
  title       = "User Guide"
  description = "Learn Salt's core concepts: states, grains, pillars, and more."
  url         = "https://docs.saltproject.io/salt/user-guide/en/latest/"

[[params.landing.nav_boxes]]
  title       = "Reference Docs"
  description = "Full module and API reference for Salt."
  url         = "https://docs.saltproject.io/en/latest/contents.html"

[[params.landing.nav_boxes]]
  title       = "Blog"
  description = "Release announcements, community updates, and Salt news."
  url         = "/blog/"

[[params.landing.nav_boxes]]
  title       = "Discord Community"
  description = "Join the Salt Project Discord, attend events, and connect with contributors."
  url         = "https://discord.gg/J7b7EscrAs"

[[params.landing.nav_boxes]]
  title       = "GitHub"
  description = "Browse the source, open issues, and contribute to Salt."
  url         = "https://github.com/saltstack/salt"

[[params.icon_links]]
  name = 'Discord'
  url  = 'https://discord.gg/J7b7EscrAs'
  icon = 'fa-brands fa-discord'

[[params.icon_links]]
  name = 'RSS'
  url  = '/community/rss-feeds/'
  icon = 'fa-solid fa-rss'

# ---------------------------------------------------------------------------
# Working groups — rendered as a table on /community/working-groups/
# by layouts/community/working-groups.html.
# ---------------------------------------------------------------------------
[[params.working_groups]]
  title           = 'MacOS'
  description     = 'Improve Salt for Apple MacOS'
  captain         = 'Wes'
  captain_handle  = 'weswhet'
  discord_channel = '#macos'

[[params.working_groups]]
  title           = 'Salt Extensions'
  description     = 'Help converting modules to Salt extensions'
  captain         = 'Shane Lee'
  captain_handle  = 'twangboy'
  discord_channel = '#salt-extensions'

[[params.working_groups]]
  title           = 'Salt Formulas'
  description     = 'Create pre-written Salt states for common use cases'
  captain         = 'Jeff Neel'
  captain_handle  = 'jeff350'
  discord_channel = '#salt-formulas'

[[params.working_groups]]
  title           = 'Security'
  description     = 'Ensure that Salt is developed using security best practices'
  captain         = 'Barney Sowood'
  captain_handle  = 'barneysowood'
  discord_channel = '#security'

[[params.working_groups]]
  title           = 'Windows'
  description     = 'Improve Salt for Windows operating systems'
  captain         = 'Shane Lee'
  captain_handle  = 'twangboy'
  discord_channel = '#windows'

# ---------------------------------------------------------------------------
# Sidebar navigation menu — three caption groups, each with children.
# Top-level items with url = '' render as expandable p.caption headers.
# ---------------------------------------------------------------------------
[[menus.sidebar]]
  name       = 'News'
  identifier = 'announcements'
  url        = ''
  weight     = 10

[[menus.sidebar]]
  name   = 'Releases'
  parent = 'announcements'
  url    = '/tags/release/'
  weight = 10

[[menus.sidebar]]
  name   = 'Blog'
  parent = 'announcements'
  url    = '/blog/'
  weight = 15

[[menus.sidebar]]
  name   = 'Tags'
  parent = 'announcements'
  url    = '/tags/'
  weight = 20

[[menus.sidebar]]
  name       = 'Documentation'
  identifier = 'documentation'
  url        = ''
  weight     = 20

[[menus.sidebar]]
  name   = 'Install Guide'
  parent = 'documentation'
  url    = 'https://docs.saltproject.io/salt/install-guide/en/latest/'
  weight = 10

[[menus.sidebar]]
  name   = 'User Guide'
  parent = 'documentation'
  url    = 'https://docs.saltproject.io/salt/user-guide/en/latest/'
  weight = 20

[[menus.sidebar]]
  name   = 'Reference Docs'
  parent = 'documentation'
  url    = 'https://docs.saltproject.io/en/latest/contents.html'
  weight = 30

[[menus.sidebar]]
  name       = 'Community'
  identifier = 'community'
  url        = ''
  weight     = 30

[[menus.sidebar]]
  name   = 'Event Calendar'
  parent = 'community'
  url    = '/community/event-calendar/'
  weight = 10

[[menus.sidebar]]
  name   = 'Working Groups'
  parent = 'community'
  url    = '/community/working-groups/'
  weight = 20

[[menus.sidebar]]
  name   = 'Salt Project Discord'
  parent = 'community'
  url    = 'https://discord.gg/J7b7EscrAs'
  weight = 30

[[menus.sidebar]]
  name   = 'Salt Project GitHub'
  parent = 'community'
  url    = 'https://github.com/saltstack'
  weight = 40

[[menus.sidebar]]
  name   = 'RSS Feeds'
  parent = 'community'
  url    = '/community/rss-feeds/'
  weight = 50

# Cross-doc navigation links (must be [[params.cross_doc_links]] at top level, not nested
# under [params.logo], so they are defined outside the [params] block above).
[[params.cross_doc_links]]
  name   = 'Home'
  url    = '/'
  active = true

[[params.cross_doc_links]]
  name = 'Install Guide'
  url  = 'https://docs.saltproject.io/salt/install-guide/en/latest/'

[[params.cross_doc_links]]
  name = 'User Guide'
  url  = 'https://docs.saltproject.io/salt/user-guide/en/latest/'

[[params.cross_doc_links]]
  name = 'Reference Docs'
  url  = 'https://docs.saltproject.io/en/latest/contents.html'
